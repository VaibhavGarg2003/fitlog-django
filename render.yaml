# Render Blueprint — fitlog-django
# ══════════════════════════════════
# One always-on web service on Render's free tier. Deploy via the Render
# dashboard: New → Blueprint → pick this repo. Secrets (sync:false) are
# pasted in the dashboard, never committed here.
#
# The service spins down after ~15 min without inbound traffic (free tier).
# Live chat needs it awake: an external pinger (cron-job.org every ≤10 min,
# UptimeRobot every 5 min with alerts) hits /api/healthz. One always-awake
# free service uses ~744 of the workspace's 750 free hours/month — never run
# a second always-awake free service in this workspace.

services:
  - type: web
    name: fitlog-django
    runtime: python
    plan: free
    region: singapore # closest Render region to India
    branch: main
    buildCommand: "./build.sh"
    # ASGI (uvicorn) so the same process serves HTTP AND the live-chat
    # WebSockets (apps.chat). Exactly ONE worker: the in-memory channel layer
    # cannot cross processes (scaling out = channels_redis first).
    #   --host 0.0.0.0 --port $PORT   reachable from Render's proxy
    #   --proxy-headers               trust X-Forwarded-Proto (https) from Render
    #   --lifespan off                Django/Channels don't use lifespan events
    #   --ws-max-size 4096            clients only send tiny control frames
    #   --ws-per-message-deflate false  compression costs ~50 KB RAM per socket
    #   --timeout-graceful-shutdown 10  deploys close sockets promptly; clients
    #                                 reconnect with backoff
    startCommand: >-
      uvicorn config.asgi:application --host 0.0.0.0 --port $PORT --workers 1
      --proxy-headers --forwarded-allow-ips="*" --lifespan off --ws websockets
      --ws-max-size 4096 --ws-per-message-deflate false
      --timeout-graceful-shutdown 10
    healthCheckPath: /api/healthz
    envVars:
      # Non-secret, safe to commit — force prod settings + pin Python.
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.7"
      # ── Secrets — set these in the Render dashboard (sync:false) ──
      - key: DJANGO_SECRET_KEY
        sync: false
      # SESSION POOLER (host "*.pooler.supabase.com", port 5432, username
      # "postgres.<project-ref>") — NOT the direct connection. The direct
      # hostname (db.<ref>.supabase.co) resolves ONLY to an IPv6 address;
      # Render's free tier has no IPv6 egress, so it cannot reach it at
      # runtime. The pooler resolves to real IPv4 addresses. Session mode
      # (not the 6543 transaction mode) is Supabase's own recommendation
      # for a persistent server process like this one (vs. serverless).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL # prod project URL (drives JWT verification)
        sync: false
      - key: CORS_ALLOWED_ORIGINS # the Next.js Vercel origin(s), comma-separated
        sync: false
      # ── Live chat (apps.chat) — OFF unless both secrets are set ──
      # Same values as the Next.js app's env; the two secrets must differ.
      - key: CHAT_WS_TICKET_SECRET # ≥32 chars; verifies WebSocket tickets
        sync: false
      - key: CHAT_RELAY_SECRET # ≥32 chars; authenticates Next.js → relay calls
        sync: false
      - key: CHAT_WS_ALLOWED_ORIGINS # browser origins allowed to open the socket
        sync: false
